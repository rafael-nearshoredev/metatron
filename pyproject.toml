[project]
name = "metatron"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "colorama>=0.4.6",
    "fastapi>=0.115.0",
    "openai>=2.8.1",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.0.0",
    "torch>=2.9.1",
    "transformers>=4.57.1",
    "typer>=0.20.0",
    "uvicorn>=0.38.0",
    # LiveKit integration
    "livekit>=0.17.0",
    "livekit-agents>=0.10.0",
    "livekit-plugins-openai>=0.8.0",
    "livekit-plugins-silero>=0.7.0",
    # ElevenLabs TTS
    "elevenlabs>=1.0.0",
    # HTTP client for API calls
    "httpx>=0.27.0",
    "livekit-plugins-elevenlabs>=1.3.3",
]

[project.scripts]
metatron = "metatron.cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metatron"]

[tool.uv]
package = true

[dependency-groups]
dev = []
